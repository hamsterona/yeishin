appId: xyz.yabbyville.yeishin
productName: Yeishin
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
electronVersion: 43.7.0
directories:
    buildResources: assets
files:
    - 'out/**/*'
    - 'package.json'
extraResources:
    - assets/**
asarUnpack:
    - resources/**
win:
    target:
        - target: zip
          arch:
              - x64
              - arm64
        - target: nsis
          arch:
              - x64
              - arm64
    icon: assets/icons/icon.ico

nsis:
    allowToChangeInstallationDirectory: true
    oneClick: false
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always

mac:
    target:
        - target: dmg
          arch:
              - arm64
              - x64
        - target: zip
          arch:
              - arm64
              - x64
    icon: media/feishin.icon
    type: distribution
    hardenedRuntime: false
    # Release builds sign with the Yeishin self-signed certificate (see YEISHIN.md);
    # without YEISHIN_MAC_SIGN_IDENTITY the hook signs ad-hoc.
    identity: "-"
    sign: ./scripts/mac-sign.mjs
    entitlements: build/entitlements.mac.plist
    entitlementsInherit: build/entitlements.mac.plist
    gatekeeperAssess: false
    notarize: false
    extendInfo:
        NSAudioCaptureUsageDescription: 'System audio access is required for mpv visualizer capture in Yeishin'
        NSLocalNetworkUsageDescription: 'Local network is necessary for accessing servers hosted on the same system as Yeishin'

dmg:
    contents: [{ x: 130, y: 220 }, { x: 410, y: 220, type: link, path: /Applications }]

linux:
    target:
        - AppImage
        - deb
        - tar.xz
    category: AudioVideo;Audio;Player
    icon: assets/icons/icon.png
    artifactName: ${productName}-${os}-${arch}.${ext}

toolsets:
    appimage: '1.0.3'

npmRebuild: false
afterAllArtifactBuild: scripts/after-all-artifact-build.mjs
publish:
    provider: github
    owner: hamsterona
    repo: yeishin
    channel: latest
    tagNamePrefix: yeishin-v
    releaseType: draft