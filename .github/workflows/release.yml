name: Release

# Push a tag yeishin-v<package.json version> on the yabby branch to build and
# publish macOS and Windows installers to a GitHub release. The installed apps
# check that release feed for updates.

on:
    push:
        tags:
            - 'yeishin-v*'

permissions:
    contents: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Tag matches package.json version
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "yeishin-v$version" != "$GITHUB_REF_NAME" ]; then
                    echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
                    exit 1
                  fi

            - name: Create draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
                    --title "Yeishin ${GITHUB_REF_NAME#yeishin-v}" \
                    --notes "Yeishin, Feishin with Yabbyville stickers. See the commit history for changes."

    build:
        needs: prepare
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-26
                      script: publish:mac
                    - os: windows-latest
                      script: publish:win
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v4

            - run: pnpm install

            # macOS updates only install in place when every release is signed by the
            # same certificate, so never publish an unsigned macOS build.
            # macOS only, so Windows stays unsigned. The certificate goes into our own
            # keychain rather than CSC_LINK: electron-builder 26.15.7 unlocks its keychain
            # with the .p12 password, which fails. scripts/mac-sign.mjs signs with the
            # certificate whose SHA-1 is YEISHIN_MAC_SIGN_IDENTITY (public).
            - name: Import the macOS signing certificate
              if: runner.os == 'macOS'
              env:
                  MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
                  MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
              run: |
                  if [ -z "$MAC_CSC_LINK" ] || [ -z "$MAC_CSC_KEY_PASSWORD" ]; then
                    echo "Secrets MAC_CSC_LINK and MAC_CSC_KEY_PASSWORD are required (see YEISHIN.md)" >&2
                    exit 1
                  fi
                  keychain="$RUNNER_TEMP/yeishin-signing.keychain-db"
                  keychain_password=$(openssl rand -base64 32)
                  p12="$RUNNER_TEMP/yeishin-signing.p12"
                  printf %s "$MAC_CSC_LINK" | tr -d '\r\n' | base64 --decode > "$p12"
                  security create-keychain -p "$keychain_password" "$keychain"
                  security set-keychain-settings -lut 21600 "$keychain"
                  security unlock-keychain -p "$keychain_password" "$keychain"
                  security import "$p12" -k "$keychain" -T /usr/bin/codesign \
                    -P "$(printf %s "$MAC_CSC_KEY_PASSWORD" | tr -d '\r\n')"
                  rm -f "$p12"
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
                    -k "$keychain_password" "$keychain" > /dev/null
                  security list-keychains -d user -s "$keychain" \
                    $(security list-keychains -d user | tr -d '"')
                  security find-identity -p codesigning "$keychain" \
                    | grep -q BFD00AF9EB4B2C31757869A56496433C5DB2233A
                  echo "YEISHIN_MAC_SIGN_IDENTITY=BFD00AF9EB4B2C31757869A56496433C5DB2233A" >> "$GITHUB_ENV"

            - name: Build and upload to the draft release
              env:
                  NODE_OPTIONS: --max-old-space-size=4096
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              uses: nick-invision/retry@v3.0.2
              with:
                  timeout_minutes: 30
                  max_attempts: 3
                  retry_on: error
                  command: pnpm run ${{ matrix.script }}
                  on_retry_command: pnpm cache delete

            - name: macOS apps are signed with the Yeishin certificate
              if: runner.os == 'macOS'
              run: |
                  for app in dist/mac*/Yeishin.app; do
                    codesign --verify --deep --strict "$app"
                    codesign -d -r- "$app" 2>&1 | grep -qi "certificate root = H\"$YEISHIN_MAC_SIGN_IDENTITY\"" \
                      || { echo "$app is not signed with the Yeishin certificate" >&2; exit 1; }
                  done

    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
